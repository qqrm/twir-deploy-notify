name: TWIR Prod summary

on:
  schedule:
    # once per day
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  evaluate-latest:
    name: Evaluate latest TWIR post
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_send: ${{ steps.decide.outputs.should_send }}
      latest_post: ${{ steps.decide.outputs.latest_post }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download last_sent artifact from previous production run
        run: |
          set -euo pipefail

          # Server-side status/branch filters can return a stale run index.
          # Filter the recent runs locally and include successful manual
          # production deliveries from release branches so their markers
          # carry forward to main after a recovery.
          ids=$(
            gh api \
              "repos/${{ github.repository }}/actions/workflows/prod.yml/runs?per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")][0:10][] | .id' \
            || echo ""
          )

          for prev in $ids; do
            for name in last-sent-prod last-sent; do
              if gh run download "$prev" --repo "${{ github.repository }}" -n "$name" --dir . && [ -s last_sent.txt ]; then
                echo "Restored last_sent marker from run $prev (artifact $name)."
                exit 0
              fi
              rm -f last_sent.txt
            done
          done

          # The marker chain must never break a run: with no inherited marker
          # the delivery below treats the newest issue as unsent (the pin
          # guard still blocks a prod duplicate) and this run republishes the
          # marker, rebuilding the chain for the next run.
          echo "::warning::No recent production run yielded a last_sent marker; continuing without cached state." >&2

      - name: Checkout TWIR
        uses: actions/checkout@v7
        with:
          repository: rust-lang/this-week-in-rust
          path: twir
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            content/

      - name: Decide whether to send notifications
        id: decide
        run: |
          set -euo pipefail

          latest_post=$(ls twir/content/*-this-week-in-rust*.md | sort | tail -n 1)
          echo "latest_post=$latest_post" >> "$GITHUB_OUTPUT"

          last_sent=$(cat last_sent.txt 2>/dev/null || echo "")
          if [ -n "$latest_post" ] && [ "$latest_post" != "$last_sent" ]; then
            echo "should_send=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_send=false" >> "$GITHUB_OUTPUT"
          fi

      # A no-op run becomes the next run's lookup target: it must always
      # republish the marker so the chain stays unbroken. If the inherited
      # marker went missing, materialize it from the latest post — a no-op
      # decision already means that post counts as delivered.
      - name: Preserve last_sent marker when delivery is not needed
        if: steps.decide.outputs.should_send == 'false'
        run: |
          set -euo pipefail
          if [ ! -s last_sent.txt ]; then
            echo "${{ steps.decide.outputs.latest_post }}" > last_sent.txt
          fi

      - name: Upload preserved last_sent marker
        if: steps.decide.outputs.should_send == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: last-sent-prod
          path: last_sent.txt
          if-no-files-found: error

  notify-dev:
    name: TWIR dev summary delivery from prod
    needs: evaluate-latest
    if: needs.evaluate-latest.outputs.should_send == 'true'
    uses: ./.github/workflows/common-delivery.yml
    secrets: inherit
    with:
      scope: dev
      send_main: false
      send_dev: true
      artifact_scope: dev-prod

  notify-prod:
    name: TWIR prod summary delivery
    needs:
      - evaluate-latest
      - notify-dev
    if: needs.evaluate-latest.outputs.should_send == 'true'
    uses: ./.github/workflows/common-delivery.yml
    secrets: inherit
    with:
      scope: prod
      send_main: true
      send_dev: false
      artifact_scope: prod
